[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "software-quality-digital-twin-lab"
version = "0.1.0"
description = "Research framework for software-quality digital twins and predictive software assurance"
requires-python = ">=3.11"
authors = [{name = "Hira Khyzer"}]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
